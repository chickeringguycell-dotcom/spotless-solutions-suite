name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk ./SOS_Estimator.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOS_Estimator_APK
          path: ./SOS_Estimator.apk
          if-no-files-found: ignore
